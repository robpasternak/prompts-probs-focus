[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmfocus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.49.2",
    "huggingface-hub>=1.24.0",
    "jupyterlab>=4.6.1",
    "minicons>=0.3.38",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.1",
    "seaborn>=0.13.2",
    "torch==2.10.0",
]

[project.optional-dependencies]
cli = [
    "transformers>=5.12.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmfocus*"]
